<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STEVIE AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --bg: #FFF8ED;
    --sidebar: #FFFFFF;
    --card: #FFFEFA;
    --primary: #FF8A00;
    --secondary: #FFB45C;
    --text: #171717;
    --muted: #686868;
    --border: #F0E5D6;
    --danger: #E53935;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
}

/* AUTHENTICATION */

.auth-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
}

.auth-box {
    background: white;
    width: 100%;
    max-width: 410px;
    padding: 30px;
    border: 1px solid var(--border);
    border-radius: 20px;
}

.logo {
    color: var(--primary);
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 1px;
    text-align: center;
}

.auth-subtitle {
    color: var(--muted);
    text-align: center;
    margin: 10px 0 25px;
    font-size: 14px;
}

.auth-box input {
    width: 100%;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 13px;
    outline: none;
    font-size: 14px;
}

.auth-box input:focus {
    border-color: var(--primary);
}

button {
    cursor: pointer;
    border: none;
    font-family: inherit;
}

.primary-btn {
    background: var(--primary);
    color: white;
    padding: 13px;
    border-radius: 10px;
    font-weight: bold;
    width: 100%;
}

.primary-btn:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.auth-links {
    display: flex;
    justify-content: space-between;
    margin-top: 17px;
    font-size: 13px;
}

.auth-links button {
    color: var(--primary);
    background: none;
}

/* APPLICATION */

#app {
    display: none;
    height: 100vh;
}

.layout {
    display: flex;
    height: 100%;
}

/* SIDEBAR */

.sidebar {
    width: 270px;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 18px;
    flex-shrink: 0;
}

.brand {
    font-size: 23px;
    font-weight: 900;
    color: var(--primary);
    margin-bottom: 25px;
}

.new-chat {
    background: var(--primary);
    color: white;
    padding: 13px;
    border-radius: 10px;
    font-weight: bold;
    margin-bottom: 25px;
}

.sidebar-title {
    font-size: 12px;
    color: var(--muted);
    font-weight: bold;
    margin-bottom: 12px;
    text-transform: uppercase;
}

.chat-list {
    flex: 1;
    overflow-y: auto;
}

.chat-item {
    padding: 12px;
    border-radius: 9px;
    font-size: 13px;
    margin-bottom: 5px;
    cursor: pointer;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.chat-item:hover,
.chat-item.active {
    background: #FFF1DC;
}

.user-profile {
    border-top: 1px solid var(--border);
    padding-top: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.profile-email {
    font-size: 11px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
}

.logout-btn {
    color: var(--danger);
    background: none;
    font-size: 12px;
}

/* MAIN */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.topbar {
    height: 65px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: rgba(255,255,255,.7);
}

.top-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.menu-btn {
    background: none;
    font-size: 23px;
    display: none;
}

.top-title {
    font-weight: bold;
    font-size: 17px;
}

.top-controls {
    display: flex;
    gap: 8px;
}

.top-controls select {
    border: 1px solid var(--border);
    background: white;
    padding: 9px;
    border-radius: 8px;
    font-size: 12px;
    outline: none;
}

/* CHAT AREA */

.chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 25px 7%;
    scroll-behavior: smooth;
}

.welcome {
    max-width: 650px;
    margin: 12vh auto 30px;
    text-align: center;
}

.welcome h1 {
    font-size: 34px;
    margin-bottom: 12px;
}

.welcome h1 span {
    color: var(--primary);
}

.welcome p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
}

.suggestions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    max-width: 650px;
    margin: 25px auto;
}

.suggestion {
    text-align: left;
    padding: 17px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 13px;
    color: var(--text);
}

.suggestion:hover {
    border-color: var(--primary);
}

.suggestion strong {
    display: block;
    margin-bottom: 5px;
}

.suggestion span {
    color: var(--muted);
    font-size: 12px;
}

/* MESSAGE ALIGNMENT */

.message-row {
    display: flex;
    width: 100%;
    margin: 17px 0;
}

.message-row.user {
    justify-content: flex-end;
}

.message-row.assistant {
    justify-content: flex-start;
}

.message-bubble {
    max-width: 78%;
    padding: 13px 16px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.7;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.message-row.user .message-bubble {
    background: var(--primary);
    color: white;
    border-bottom-right-radius: 5px;
}

.message-row.assistant .message-bubble {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 5px;
}

.message-bubble pre {
    overflow-x: auto;
    background: #191919;
    color: #fff;
    padding: 13px;
    border-radius: 9px;
    margin: 10px 0;
    white-space: pre;
}

.message-bubble code {
    font-family: monospace;
}

.message-bubble p {
    margin-bottom: 8px;
}

.message-bubble p:last-child {
    margin-bottom: 0;
}

.sources {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 12px;
}

.sources a {
    display: block;
    color: var(--primary);
    margin-top: 6px;
    overflow-wrap: anywhere;
}

.engine-label {
    font-size: 10px;
    color: var(--muted);
    margin-top: 7px;
}

/* INPUT AREA */

.input-area {
    padding: 15px 7% 18px;
    background: var(--bg);
}

.input-box {
    max-width: 850px;
    margin: auto;
    background: white;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
}

.input-box textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    padding: 9px;
    font-size: 14px;
    font-family: inherit;
    max-height: 150px;
    min-height: 40px;
}

.send-btn {
    background: var(--primary);
    color: white;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    font-size: 18px;
    flex-shrink: 0;
}

.footer-note {
    text-align: center;
    color: var(--muted);
    font-size: 10px;
    margin-top: 10px;
}

.status {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin: 8px;
}

/* MOBILE */

@media(max-width:700px) {
    .sidebar {
        position: fixed;
        left: -280px;
        top: 0;
        bottom: 0;
        z-index: 100;
        transition: .25s;
    }

    .sidebar.open {
        left: 0;
    }

    .menu-btn {
        display: block;
    }

    .topbar {
        padding: 0 12px;
    }

    .top-controls select {
        max-width: 105px;
    }

    .chat-area {
        padding: 18px 12px;
    }

    .input-area {
        padding: 12px;
    }

    .message-bubble {
        max-width: 88%;
    }

    .welcome h1 {
        font-size: 27px;
    }

    .suggestions {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<!-- AUTHENTICATION SCREEN -->

<div class="auth-screen" id="authScreen">

    <div class="auth-box">

        <div class="logo">STEVIE AI</div>

        <div class="auth-subtitle">
            Your ideas. Your world. Let's build.
        </div>

        <form id="authForm">

            <input
                type="email"
                id="email"
                placeholder="Email address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit" class="primary-btn" id="authButton">
                Login
            </button>

        </form>

        <div class="auth-links">

            <button type="button" onclick="toggleAuth()" id="toggleAuthBtn">
                Create account
            </button>

            <button type="button" onclick="forgotPassword()">
                Forgot password?
            </button>

        </div>

        <p id="authMessage" class="status"></p>

    </div>

</div>


<!-- APPLICATION -->

<div id="app">

<div class="layout">

    <aside class="sidebar" id="sidebar">

        <div class="brand">STEVIE AI</div>

        <button class="new-chat" onclick="newChat()">
            + New Chat
        </button>

        <div class="sidebar-title">
            Recent Conversations
        </div>

        <div class="chat-list" id="chatList"></div>

        <div class="user-profile">

            <div class="profile-email" id="profileEmail">
                User
            </div>

            <button class="logout-btn" onclick="logout()">
                Logout
            </button>

        </div>

    </aside>

    <main class="main">

        <header class="topbar">

            <div class="top-left">

                <button class="menu-btn" onclick="toggleSidebar()">
                    ☰
                </button>

                <div class="top-title">
                    STEVIE AI
                </div>

            </div>

            <div class="top-controls">

                <select id="modeSelect">
                    <option value="chat">Chat</option>
                    <option value="writer">Writer</option>
                    <option value="music">Music</option>
                    <option value="code">Code</option>
                    <option value="research">Research</option>
                    <option value="verify">Fact Verification</option>
                </select>

                <select id="engineSelect">
                    <option value="auto">Auto Engine</option>
                    <option value="gemini">Gemini</option>
                    <option value="groq">Groq</option>
                </select>

            </div>

        </header>

        <section class="chat-area" id="chatArea">

            <div class="welcome" id="welcome">

                <h1>
                    Hello, <span>I'm STEVIE.</span>
                </h1>

                <p>
                    Your AI assistant is ready.
                    Ask questions, explore ideas,
                    write music, build projects and more.
                </p>

                <div class="suggestions">

                    <button class="suggestion"
                        onclick="useSuggestion('Help me develop a new business idea.')">
                        <strong>Business Ideas</strong>
                        <span>Develop your next big idea.</span>
                    </button>

                    <button class="suggestion"
                        onclick="useSuggestion('Write a powerful song for me.')">
                        <strong>Music Creation</strong>
                        <span>Create songs and lyrics.</span>
                    </button>

                    <button class="suggestion"
                        onclick="useSuggestion('Help me build an Android application.')">
                        <strong>App Development</strong>
                        <span>Build something useful.</span>
                    </button>

                    <button class="suggestion"
                        onclick="useSuggestion('Research the latest technology trends.')">
                        <strong>Research</strong>
                        <span>Explore information and sources.</span>
                    </button>

                </div>

            </div>

            <div id="messages"></div>

            <div id="loadingStatus" class="status"></div>

        </section>

        <footer class="input-area">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    placeholder="Message STEVIE AI..."
                    rows="1"
                ></textarea>

                <button class="send-btn" id="sendButton"
                    onclick="sendMessage()">
                    ➤
                </button>

            </div>

            <div class="footer-note">
                STEVIE AI can make mistakes. Verify important information.
            </div>

        </footer>

    </main>

</div>
</div>


<script>

/* =================================
   CONFIGURATION
================================= */

const SUPABASE_URL =
"https://zaqijuxyibqkdvnxruvh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VRQRTg0NhvhYFacvboQdpw_npqAmh-0";

const API_URL =
"https://script.google.com/macros/s/AKfycbxtKDjsn_KTi-Adx4e4Co0jyCmp5_gLQyc4VN7aJZ4IcJVlea_UzttFNzYVpozyQ5OD_g/exec";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =================================
   APPLICATION STATE
================================= */

let currentUser = null;
let currentChatId = null;
let conversation = [];
let isSignup = false;
let isSending = false;
let userMemories = [];

const clientId = getClientId();


function getClientId() {

    let id = localStorage.getItem("stevie_client_id");

    if (!id) {
        id = "stevie_" +
             Math.random().toString(36).substring(2) +
             Date.now();

        localStorage.setItem("stevie_client_id", id);
    }

    return id;
}


/* =================================
   AUTHENTICATION
================================= */

function toggleAuth() {

    isSignup = !isSignup;

    document.getElementById("authButton").textContent =
        isSignup ? "Create Account" : "Login";

    document.getElementById("toggleAuthBtn").textContent =
        isSignup ? "Already have an account?" : "Create account";

    document.getElementById("authMessage").textContent = "";
}


document.getElementById("authForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("authMessage");

    const button =
        document.getElementById("authButton");

    button.disabled = true;
    message.textContent = "Please wait...";

    try {

        let result;

        if (isSignup) {

            result = await supabaseClient.auth.signUp({
                email: email,
                password: password
            });

        } else {

            result = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        }

        if (result.error) {
            throw result.error;
        }

        if (isSignup && !result.data.session) {

            message.textContent =
                "Account created. Please check your email to confirm your account.";

        } else {

            await showApp(result.data.user);

        }

    } catch(error) {

        message.textContent = error.message;

    } finally {

        button.disabled = false;

    }

});


async function forgotPassword() {

    const email =
        document.getElementById("email").value.trim();

    const message =
        document.getElementById("authMessage");

    if (!email) {
        message.textContent = "Enter your email address first.";
        return;
    }

    const { error } =
        await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin
        });

    message.textContent = error
        ? error.message
        : "Password reset email sent.";
}


async function logout() {

    await supabaseClient.auth.signOut();

    currentUser = null;
    currentChatId = null;
    conversation = [];
    userMemories = [];

    document.getElementById("messages").innerHTML = "";
    document.getElementById("chatList").innerHTML = "";

    document.getElementById("app").style.display = "none";
    document.getElementById("authScreen").style.display = "flex";

}


/* =================================
   SESSION
================================= */

async function loadSession() {

    const { data, error } =
        await supabaseClient.auth.getSession();

    if (error) {
        console.error(error);
        return;
    }

    if (data.session) {
        await showApp(data.session.user);
    }

}


supabaseClient.auth.onAuthStateChange(
    function(event, session) {

        setTimeout(async function() {

            if (session) {

                if (
                    !currentUser ||
                    currentUser.id !== session.user.id
                ) {
                    await showApp(session.user);
                }

            } else {

                currentUser = null;
                currentChatId = null;
                conversation = [];
                userMemories = [];

                document.getElementById("messages").innerHTML = "";
                document.getElementById("chatList").innerHTML = "";

                document.getElementById("app").style.display = "none";
                document.getElementById("authScreen").style.display = "flex";

            }

        }, 0);

    }
);


/* =================================
   STEVIE AI MEMORY SYSTEM
================================= */

async function loadMemories() {

    if (!currentUser) return [];

    const userId = currentUser.id;

    const { data, error } = await supabaseClient
        .from("memories")
        .select("id, content, created_at")
        .eq("user_id", userId)
        .order("created_at", { ascending: false });

    if (error) {
        console.error("Memory loading error:", error);
        return [];
    }

    if (!currentUser || currentUser.id !== userId) return [];

    userMemories = data || [];

    return userMemories;
}


async function saveMemory(content) {

    if (!currentUser) {
        throw new Error("Please login first.");
    }

    const cleanContent = content.trim();

    if (!cleanContent) return;

    const userId = currentUser.id;

    const { data, error } = await supabaseClient
        .from("memories")
        .insert({
            user_id: userId,
            content: cleanContent
        })
        .select()
        .single();

    if (error) {
        console.error("Memory saving error:", error);
        throw error;
    }

    if (currentUser && currentUser.id === userId) {
        userMemories.unshift(data);
    }

    return data;
}


async function deleteMemory(memoryId) {

    if (!currentUser) return;

    const userId = currentUser.id;

    const { error } = await supabaseClient
        .from("memories")
        .delete()
        .eq("id", memoryId)
        .eq("user_id", userId);

    if (error) {
        console.error("Memory deletion error:", error);
        throw error;
    }

    if (currentUser && currentUser.id === userId) {
        userMemories = userMemories.filter(
            memory => memory.id !== memoryId
        );
    }

}


/* =================================
   SHOW APPLICATION
================================= */

async function showApp(user) {

    if (!user) return;

    currentUser = user;
    currentChatId = null;
    conversation = [];
    userMemories = [];

    document.getElementById("authScreen").style.display = "none";
    document.getElementById("app").style.display = "block";

    document.getElementById("profileEmail").textContent =
        user.email || "User";

    await loadMemories();
    await loadChats();

}


/* =================================
   CHAT MANAGEMENT
================================= */

async function loadChats() {

    if (!currentUser) return;

    const userId = currentUser.id;

    const { data, error } =
        await supabaseClient
        .from("chats")
        .select("*")
        .eq("user_id", userId)
        .order("created_at", { ascending: false });

    if (error) {
        console.error("Chat loading error:", error);
        return;
    }

    if (!currentUser || currentUser.id !== userId) return;

    const list = document.getElementById("chatList");

    list.innerHTML = "";

    (data || []).forEach(function(chat) {

        const item = document.createElement("div");

        item.className =
            "chat-item" +
            (chat.id === currentChatId ? " active" : "");

        item.textContent = chat.title || "New Chat";

        item.onclick = function() {
            openChat(chat.id);
        };

        list.appendChild(item);

    });

}


async function newChat() {

    currentChatId = null;
    conversation = [];

    document.getElementById("messages").innerHTML = "";
    document.getElementById("welcome").style.display = "block";
    document.getElementById("loadingStatus").textContent = "";

    await loadChats();

    document.getElementById("messageInput").focus();

    closeSidebar();

}


async function createChat(title) {

    if (!currentUser) {
        throw new Error("User session unavailable.");
    }

    const { data, error } =
        await supabaseClient
        .from("chats")
        .insert({
            user_id: currentUser.id,
            title: title.substring(0, 60)
        })
        .select()
        .single();

    if (error) throw error;

    currentChatId = data.id;

    await loadChats();

    return data;

}


async function openChat(chatId) {

    if (!currentUser || !chatId) return;

    const activeUserId = currentUser.id;

    currentChatId = null;
    conversation = [];

    document.getElementById("messages").innerHTML = "";
    document.getElementById("welcome").style.display = "none";

    const { data: chat, error: chatError } =
        await supabaseClient
        .from("chats")
        .select("id")
        .eq("id", chatId)
        .eq("user_id", activeUserId)
        .maybeSingle();

    if (chatError || !chat) {

        alert("Chat not found or access denied.");

        document.getElementById("welcome").style.display = "block";

        return;
    }

    if (!currentUser || currentUser.id !== activeUserId) return;

    currentChatId = chatId;

    const { data: messages, error } =
        await supabaseClient
        .from("messages")
        .select("*")
        .eq("chat_id", chatId)
        .eq("user_id", activeUserId)
        .order("created_at", { ascending: true });

    if (error) {
        console.error(error);
        alert(error.message);
        return;
    }

    if (!currentUser || currentUser.id !== activeUserId) return;

    (messages || []).forEach(function(msg) {

        conversation.push({
            role: msg.role,
            content: msg.content
        });

        addMessage(msg.role, msg.content);

    });

    await loadChats();

    closeSidebar();

    document.getElementById("chatArea").scrollTop =
        document.getElementById("chatArea").scrollHeight;

}


async function saveMessage(role, content) {

    if (!currentUser || !currentChatId) {
        throw new Error("User or chat session is missing.");
    }

    const { error } = await supabaseClient
        .from("messages")
        .insert({
            chat_id: currentChatId,
            user_id: currentUser.id,
            role: role,
            content: content
        });

    if (error) {
        console.error("Message save error:", error);
        throw error;
    }

}


/* =================================
   MESSAGE DISPLAY
================================= */

function addMessage(role, content, sources, engine) {

    document.getElementById("welcome").style.display = "none";

    const messages = document.getElementById("messages");

    const row = document.createElement("div");

    row.className =
        "message-row " +
        (role === "user" ? "user" : "assistant");

    const bubble = document.createElement("div");

    bubble.className = "message-bubble";

    bubble.innerHTML = formatMessage(content);

    row.appendChild(bubble);

    messages.appendChild(row);

    if (sources && sources.length) {

        const sourceBox = document.createElement("div");

        sourceBox.className = "sources";
        sourceBox.innerHTML = "<strong>Sources:</strong>";

        sources.forEach(function(source) {

            const link = document.createElement("a");

            link.href = source.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = source.title || source.url;

            sourceBox.appendChild(link);

        });

        bubble.appendChild(sourceBox);

    }

    if (engine) {

        const label = document.createElement("div");

        label.className = "engine-label";
        label.textContent = "Powered by " + engine;

        bubble.appendChild(label);

    }

    return row;

}


function escapeHTML(text) {

    return String(text).replace(/[&<>"']/g, function(char) {

        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        }[char];

    });

}


function formatMessage(text) {

    let safe = escapeHTML(text);

    safe = safe.replace(
        /```([\s\S]*?)```/g,
        "<pre><code>$1</code></pre>"
    );

    safe = safe.replace(
        /`([^`]+)`/g,
        "<code>$1</code>"
    );

    safe = safe.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
    );

    safe = safe.replace(/\n/g, "<br>");

    return safe;

}


/* =================================
   SEND MESSAGE
================================= */

async function sendMessage() {

    if (isSending || !currentUser) return;

    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const status = document.getElementById("loadingStatus");

    const text = input.value.trim();

    if (!text) return;

    isSending = true;
    sendButton.disabled = true;

    input.value = "";
    input.style.height = "40px";

    addMessage("user", text);

    conversation.push({
        role: "user",
        content: text
    });

    status.textContent = "STEVIE is thinking...";

    try {

        if (!currentChatId) {
            await createChat(text);
        }

        await saveMessage("user", text);

        const mode = document.getElementById("modeSelect").value;
        const engine = document.getElementById("engineSelect").value;
        const history = conversation.slice(-13, -1);

        const { data: sessionData } =
            await supabaseClient.auth.getSession();

        const accessToken =
            sessionData.session
                ? sessionData.session.access_token
                : "";

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },

            body: JSON.stringify({

                message: text,
                mode: mode,
                engine: engine,
                clientId: clientId,
                history: history,
                accessToken: accessToken

            })

        });

        if (!response.ok) {
            throw new Error("Server error: " + response.status);
        }

        const result = await response.json();

        if (!result.success) {
            throw new Error(
                result.error || "STEVIE could not complete your request."
            );
        }

        const reply =
            result.response || result.reply || "No response received.";

        conversation.push({
            role: "assistant",
            content: reply
        });

        addMessage(
            "assistant",
            reply,
            result.sources || [],
            result.engine
        );

        await saveMessage("assistant", reply);

        status.textContent = "";

        await loadChats();

    } catch(error) {

        console.error("STEVIE Error:", error);

        addMessage(
            "assistant",
            "Sorry, something went wrong: " + error.message
        );

        status.textContent = "Request failed.";

    } finally {

        isSending = false;
        sendButton.disabled = false;
        input.focus();

        document.getElementById("chatArea").scrollTop =
            document.getElementById("chatArea").scrollHeight;

    }

}
