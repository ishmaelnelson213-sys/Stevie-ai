<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090d14">
<title>STEVIE AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg:#090d14;
  --panel:#101722;
  --panel2:#151f2c;
  --line:#243244;
  --text:#eef5ff;
  --muted:#91a1b5;
  --cyan:#37d7e8;
  --blue:#2586ff;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,Arial,sans-serif;
}

button,input,textarea,select {
  font:inherit;
}

button {
  cursor:pointer;
}

.hidden {
  display:none!important;
}

/* AUTHENTICATION */

.auth-screen {
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:radial-gradient(circle at 50% 0,#123047 0,transparent 45%),var(--bg);
}

.auth-card {
  width:min(420px,100%);
  padding:34px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:0 25px 80px #0008;
}

.brand {
  font-size:34px;
  font-weight:850;
  letter-spacing:-1.5px;
}

.brand span,
.side-brand span {
  color:var(--cyan);
}

.tagline {
  color:var(--muted);
  margin:6px 0 28px;
}

.field {
  width:100%;
  padding:14px 15px;
  margin:8px 0;
  background:#0b121c;
  border:1px solid var(--line);
  border-radius:12px;
  color:var(--text);
  outline:none;
}

.field:focus,
textarea:focus {
  border-color:var(--cyan);
}

.primary {
  width:100%;
  padding:14px;
  margin:12px 0;
  background:linear-gradient(100deg,var(--blue),#16b8cb);
  border:0;
  border-radius:12px;
  color:white;
  font-weight:750;
}

.text-btn {
  background:none;
  border:0;
  color:var(--cyan);
  padding:10px 0;
}

.auth-note {
  color:var(--muted);
  font-size:13px;
  margin-top:12px;
  min-height:18px;
}

/* APPLICATION */

.app {
  height:100dvh;
  display:flex;
  overflow:hidden;
}

.sidebar {
  width:270px;
  flex-shrink:0;
  background:#0d141e;
  border-right:1px solid var(--line);
  padding:18px;
  display:flex;
  flex-direction:column;
  z-index:5;
}

.side-top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.side-brand {
  font-size:23px;
  font-weight:850;
}

.small-btn,
.side-btn {
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:10px;
  padding:10px 12px;
}

.side-btn {
  width:100%;
  text-align:left;
  margin-bottom:22px;
}

.section-label {
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:1.3px;
  margin:4px 0 10px;
}

#historyList {
  overflow:auto;
  flex:1;
}

.history-item {
  display:flex;
  gap:6px;
  align-items:center;
  margin:4px 0;
}

.history-open {
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  text-align:left;
  background:transparent;
  border:0;
  color:#c9d5e4;
  padding:10px;
  border-radius:9px;
}

.history-open:hover {
  background:var(--panel2);
}

.history-delete {
  background:transparent;
  border:0;
  color:var(--muted);
  padding:8px;
}

.account {
  border-top:1px solid var(--line);
  padding-top:15px;
  color:var(--muted);
  font-size:12px;
  overflow-wrap:anywhere;
}

.main {
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar {
  height:66px;
  flex-shrink:0;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  gap:12px;
}

.top-title {
  font-weight:800;
}

.top-controls {
  display:flex;
  align-items:center;
  gap:8px;
}

.top-controls select {
  max-width:130px;
}

/* MESSAGES */

#messages {
  flex:1;
  overflow:auto;
  padding:28px max(18px,calc((100% - 850px)/2));
  scroll-behavior:smooth;
}

.welcome {
  text-align:center;
  max-width:550px;
  margin:12vh auto 0;
}

.welcome-mark {
  height:62px;
  width:62px;
  border-radius:20px;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  display:grid;
  place-items:center;
  margin:auto;
  font-size:34px;
  font-weight:900;
  color:white;
}

.welcome h1 {
  font-size:clamp(25px,4vw,36px);
  margin:22px 0 8px;
}

.welcome p {
  color:var(--muted);
}

.message {
  display:flex;
  gap:12px;
  margin:22px 0;
  align-items:flex-start;
}

.avatar {
  width:34px;
  height:34px;
  flex-shrink:0;
  border-radius:11px;
  background:var(--panel2);
  display:grid;
  place-items:center;
  font-size:13px;
  font-weight:800;
  color:var(--cyan);
}

.message.user .avatar {
  color:white;
  background:#225caa;
}

.bubble {
  max-width:100%;
  line-height:1.65;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  padding:2px 0;
}

.message.user .bubble {
  background:#142438;
  padding:12px 15px;
  border-radius:4px 14px 14px 14px;
}

.message.error .bubble {
  color:#ff9aa9;
}

.sources {
  margin:10px 0 25px 46px;
  padding:14px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:13px;
}

.sources h4 {
  margin:0 0 10px;
  font-size:13px;
  color:var(--cyan);
}

.source-link {
  display:block;
  color:#b9d9ff;
  text-decoration:none;
  font-size:13px;
  margin:8px 0;
  overflow-wrap:anywhere;
}

.source-link:hover {
  text-decoration:underline;
}

/* COMPOSER */

.composer-wrap {
  padding:14px 18px 12px;
  border-top:1px solid var(--line);
  background:#0b111a;
}

.composer {
  max-width:850px;
  margin:auto;
  display:flex;
  align-items:flex-end;
  gap:10px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:10px;
}

.composer textarea {
  flex:1;
  resize:none;
  max-height:180px;
  min-height:42px;
  border:0;
  outline:none;
  background:transparent;
  color:var(--text);
  padding:10px;
}

.composer button {
  border:0;
  border-radius:11px;
  background:var(--blue);
  color:white;
  padding:12px 17px;
  font-weight:700;
}

.composer button:disabled {
  opacity:.55;
}

.disclaimer {
  text-align:center;
  color:#6f8095;
  font-size:11px;
  margin:9px auto 0;
}

.typing {
  color:var(--muted);
}

.mobile-menu {
  display:none;
}

@media(max-width:760px) {

  .sidebar {
    position:fixed;
    inset:0 auto 0 0;
    transform:translateX(-105%);
    transition:.2s;
    width:min(300px,85vw);
    box-shadow:20px 0 50px #0008;
  }

  .sidebar.open {
    transform:translateX(0);
  }

  .mobile-menu {
    display:inline-block;
  }

  .topbar {
    padding:0 12px;
  }

  .top-controls {
    gap:5px;
  }

  .top-controls select {
    max-width:92px;
    padding:8px 5px;
  }

  .top-title {
    font-size:14px;
  }

  #messages {
    padding:18px 14px;
  }

  .welcome {
    margin-top:13vh;
  }

  .composer-wrap {
    padding:10px;
  }

  .auth-card {
    padding:26px;
  }
}
</style>
</head>

<body>

<!-- LOGIN / SIGNUP -->

<section id="authScreen" class="auth-screen">

  <div class="auth-card">

    <div class="brand">
      STEVIE <span>AI</span>
    </div>

    <div class="tagline">
      Your ideas. Your world. Let's build.
    </div>

    <div id="signupFields" class="hidden">

      <input
        id="displayName"
        class="field"
        placeholder="Your name"
        autocomplete="name"
      >

    </div>

    <input
      id="email"
      class="field"
      type="email"
      placeholder="Email address"
      autocomplete="email"
    >

    <input
      id="password"
      class="field"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="authSubmit" class="primary">
      Log in
    </button>

    <div style="display:flex;justify-content:space-between;flex-wrap:wrap">

      <button id="toggleAuth" class="text-btn">
        Create account
      </button>

      <button id="forgotBtn" class="text-btn">
        Forgot password?
      </button>

    </div>

    <div id="authNote" class="auth-note"></div>

  </div>

</section>

<!-- MAIN APP -->

<div id="app" class="app hidden">

  <aside id="sidebar" class="sidebar">

    <div class="side-top">

      <div class="side-brand">
        STEVIE <span>AI</span>
      </div>

      <button id="closeSide" class="small-btn">
        ✕
      </button>

    </div>

    <button id="newChatBtn" class="side-btn">
      ＋ New chat
    </button>

    <div class="section-label">
      Recent chats
    </div>

    <div id="historyList"></div>

    <div class="account">

      <div id="accountEmail"></div>

      <button id="logoutBtn" class="text-btn">
        Log out
      </button>

    </div>

  </aside>

  <main class="main">

    <header class="topbar">

      <div style="display:flex;align-items:center;gap:10px">

        <button id="menuBtn" class="small-btn mobile-menu">
          ☰
        </button>

        <div class="top-title">
          STEVIE AI
          <span style="color:var(--cyan)">●</span>
        </div>

      </div>

      <div class="top-controls">

        <select id="modeSelect" class="small-btn">

          <option value="chat">Chat</option>
          <option value="writer">Writer</option>
          <option value="music">Music</option>
          <option value="code">Code</option>
          <option value="research">Research</option>

        </select>

        <select id="engineSelect" class="small-btn">

          <option value="auto">Auto</option>
          <option value="gemini">Gemini</option>
          <option value="groq">Groq</option>

        </select>

        <button id="newTopBtn" class="small-btn">
          ＋ New chat
        </button>

      </div>

    </header>

    <div id="messages">

      <div id="welcome" class="welcome">

        <div class="welcome-mark">S</div>

        <h1>How can I help you today?</h1>

        <p>
          Ask me anything. Let's create something amazing.
        </p>

      </div>

    </div>

    <div class="composer-wrap">

      <div class="composer">

        <textarea
          id="prompt"
          rows="1"
          placeholder="Message STEVIE AI..."
        ></textarea>

        <button id="sendBtn">
          Send
        </button>

      </div>

      <div class="disclaimer">
        STEVIE AI can make mistakes. Check important information.
      </div>

    </div>

  </main>

</div>

<script>

/* PROJECT CONFIGURATION */

const SUPABASE_URL =
  "https://zaqijuxyibqkdvnxruvh.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_VRQRTg0NhvhYFacvboQdpw_npqAmh-0";

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxtKDjsn_KTi-Adx4e4Co0jyCmp5_gLQyc4VN7aJZ4IcJVlea_UzttFNzYVpozyQ5OD_g/exec";


/* INITIALIZATION */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

const $ = id => document.getElementById(id);

let isSignup = false;
let currentUser = null;
let currentChatId = null;
let chatHistory = [];
let busy = false;

const clientId = getClientId();


function getClientId() {

  let id = localStorage.getItem("stevie_client_id");

  if (!id) {

    id = "stevie_" +
      (crypto.randomUUID
        ? crypto.randomUUID()
        : Date.now() + "_" + Math.random().toString(36).slice(2));

    localStorage.setItem(
      "stevie_client_id",
      id
    );
  }

  return id;
}


/* AUTHENTICATION */

function setAuthNote(message, error) {

  $("authNote").textContent = message || "";

  $("authNote").style.color =
    error ? "#ff8a9b" : "var(--muted)";
}


function setAuthMode(signup) {

  isSignup = signup;

  $("signupFields").classList.toggle(
    "hidden",
    !signup
  );

  $("authSubmit").textContent =
    signup ? "Create account" : "Log in";

  $("toggleAuth").textContent =
    signup
      ? "Already have an account? Log in"
      : "Create account";

  $("forgotBtn").classList.toggle(
    "hidden",
    signup
  );

  setAuthNote("");
}


$("toggleAuth").addEventListener(
  "click",
  function() {
    setAuthMode(!isSignup);
  }
);


$("authSubmit").addEventListener(
  "click",
  async function() {

    const email = $("email").value.trim();
    const password = $("password").value;
    const displayName = $("displayName").value.trim();

    if (!email || !password) {
      return setAuthNote(
        "Enter your email and password.",
        true
      );
    }

    if (isSignup && password.length < 6) {
      return setAuthNote(
        "Password must contain at least 6 characters.",
        true
      );
    }

    $("authSubmit").disabled = true;

    setAuthNote(
      isSignup
        ? "Creating account..."
        : "Logging in..."
    );

    try {

      if (isSignup) {

        const { data, error } =
          await supabaseClient.auth.signUp({

            email: email,
            password: password,

            options: {
              data: {
                display_name: displayName
              }
            }

          });

        if (error) throw error;

        if (!data.session) {

          setAuthNote(
            "Account created. Check your email to confirm your account."
          );

        } else {

          setAuthNote(
            "Account created successfully."
          );

        }

      } else {

        const { error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) throw error;

      }

    } catch (error) {

      setAuthNote(
        error.message || "Authentication failed.",
        true
      );

    } finally {

      $("authSubmit").disabled = false;

    }

  }
);


$("forgotBtn").addEventListener(
  "click",
  async function() {

    const email = $("email").value.trim();

    if (!email) {
      return setAuthNote(
        "Enter your email address first.",
        true
      );
    }

    try {

      const { error } =
        await supabaseClient.auth.resetPasswordForEmail(email);

      if (error) throw error;

      setAuthNote(
        "Password reset email sent. Check your inbox."
      );

    } catch (error) {

      setAuthNote(error.message, true);

    }

  }
);


/* SESSION */

async function initialize() {

  const { data, error } =
    await supabaseClient.auth.getSession();

  if (error) {
    console.error(error);
  }

  if (data.session && data.session.user) {

    await showApp(data.session.user);

  } else {

    showAuth();

  }
}


supabaseClient.auth.onAuthStateChange(
  async function(_event, session) {

    if (session && session.user) {

      await showApp(session.user);

    } else {

      showAuth();

    }

  }
);


function showAuth() {

  currentUser = null;

  $("authScreen").classList.remove("hidden");
  $("app").classList.add("hidden");

}


async function showApp(user) {

  currentUser = user;

  $("authScreen").classList.add("hidden");
  $("app").classList.remove("hidden");

  $("accountEmail").textContent =
    user.email || "";

  await loadChatList();

  if (!currentChatId) {
    createNewChat();
  }

}


$("logoutBtn").addEventListener(
  "click",
  async function() {

    await supabaseClient.auth.signOut();

    currentChatId = null;
    chatHistory = [];

    showAuth();

  }
);


/* CHAT INTERFACE */

function createNewChat() {

  currentChatId = null;
  chatHistory = [];

  $("messages").innerHTML = `
    <div id="welcome" class="welcome">
      <div class="welcome-mark">S</div>
      <h1>How can I help you today?</h1>
      <p>Ask me anything. Let's create something amazing.</p>
    </div>
  `;

  $("prompt").value = "";

  $("sidebar").classList.remove("open");

}


$("newChatBtn").addEventListener(
  "click",
  createNewChat
);

$("newTopBtn").addEventListener(
  "click",
  createNewChat
);

$("menuBtn").addEventListener(
  "click",
  function() {
    $("sidebar").classList.add("open");
  }
);

$("closeSide").addEventListener(
  "click",
  function() {
    $("sidebar").classList.remove("open");
  }
);


/* DISPLAY MESSAGES */

function addMessage(role, text, error) {

  const welcome = $("welcome");

  if (welcome) {
    welcome.remove();
  }

  const row = document.createElement("div");

  row.className =
    "message " +
    role +
    (error ? " error" : "");

  const avatar = document.createElement("div");

  avatar.className = "avatar";

  avatar.textContent =
    role === "user" ? "YOU" : "S";

  const bubble = document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = text;

  row.appendChild(avatar);
  row.appendChild(bubble);

  $("messages").appendChild(row);

  $("messages").scrollTop =
    $("messages").scrollHeight;

  return row;
}


function renderSources(sources) {

  if (!Array.isArray(sources) || !sources.length) {
    return;
  }

  const box = document.createElement("div");

  box.className = "sources";

  const heading = document.createElement("h4");

  heading.textContent = "Research Sources";

  box.appendChild(heading);

  sources.forEach(function(source) {

    try {

      const url = new URL(source.url);

      if (
        url.protocol !== "https:" &&
        url.protocol !== "http:"
      ) {
        return;
      }

      const link = document.createElement("a");

      link.className = "source-link";

      link.href = url.href;

      link.target = "_blank";

      link.rel = "noopener noreferrer";

      link.textContent =
        source.title || url.hostname;

      box.appendChild(link);

    } catch (error) {

      // Ignore invalid source links.

    }

  });

  if (box.children.length > 1) {

    $("messages").appendChild(box);

  }

  $("messages").scrollTop =
    $("messages").scrollHeight;

}


function showTyping() {

  const row = addMessage(
    "assistant",
    "STEVIE is thinking..."
  );

  row.querySelector(".bubble").className =
    "bubble typing";

  return row;

}


/* SUPABASE CHAT STORAGE */

async function ensureChat(firstMessage) {

  if (currentChatId) {
    return currentChatId;
  }

  const title = firstMessage
    .trim()
    .replace(/\s+/g, " ")
    .slice(0, 60) || "New chat";

  const { data, error } =
    await supabaseClient
      .from("chats")
      .insert({
        user_id: currentUser.id,
        title: title
      })
      .select("id")
      .single();

  if (error) throw error;

  currentChatId = data.id;

  await loadChatList();

  return currentChatId;

}


async function saveChatMessage(
  chatId,
  role,
  content
) {

  const { error } =
    await supabaseClient
      .from("messages")
      .insert({
        chat_id: chatId,
        role: role,
        content: content
      });

  if (error) {
    console.error(
      "Message save failed:",
      error.message
    );
  }

}


async function loadChatList() {

  if (!currentUser) return;

  const { data, error } =
    await supabaseClient
      .from("chats")
      .select("id,title,created_at")
      .eq("user_id", currentUser.id)
      .order("created_at", {
        ascending: false
      })
      .limit(40);

  if (error) {
    console.error(error);
    return;
  }

  $("historyList").innerHTML = "";

  (data || []).forEach(function(chat) {

    const item = document.createElement("div");

    item.className = "history-item";

    const openButton = document.createElement("button");

    openButton.className = "history-open";

    openButton.textContent =
      chat.title || "New chat";

    openButton.addEventListener(
      "click",
      function() {
        openChat(chat.id);
      }
    );

    const deleteButton = document.createElement("button");

    deleteButton.className = "history-delete";

    deleteButton.textContent = "×";

    deleteButton.title = "Delete chat";

    deleteButton.addEventListener(
      "click",
      function() {
        deleteChat(chat.id);
      }
    );

    item.appendChild(openButton);
    item.appendChild(deleteButton);

    $("historyList").appendChild(item);

  });

}


async function openChat(chatId) {

  const { data: chat, error: chatError } =
    await supabaseClient
      .from("chats")
      .select("id,title")
      .eq("id", chatId)
      .eq("user_id", currentUser.id)
      .single();

  if (chatError) {
    console.error(chatError);
    return;
  }

  const { data: messages, error } =
    await supabaseClient
      .from("messages")
      .select("role,content,created_at")
      .eq("chat_id", chatId)
      .order("created_at", {
        ascending: true
      });

  if (error) {
    console.error(error);
    return;
  }

  currentChatId = chatId;

  chatHistory = [];

  $("messages").innerHTML = "";

  (messages || []).forEach(function(message) {

    const role =
      message.role === "assistant"
        ? "assistant"
        : "user";

    const content =
      String(message.content || "");

    addMessage(role, content);

    chatHistory.push({
      role: role,
      text: content
    });

  });

  $("sidebar").classList.remove("open");

}


async function deleteChat(chatId) {

  const confirmed =
    confirm("Delete this conversation?");

  if (!confirmed) return;

  const { error } =
    await supabaseClient
      .from("chats")
      .delete()
      .eq("id", chatId)
      .eq("user_id", currentUser.id);

  if (error) {

    alert("Could not delete this chat.");

    console.error(error);

    return;

  }

  if (currentChatId === chatId) {
    createNewChat();
  }

  await loadChatList();

}


/* SEND MESSAGE TO STEVIE */

async function sendMessage() {

  if (busy) return;

  const message = $("prompt").value.trim();

  if (!message) return;

  if (!currentUser) {

    addMessage(
      "assistant",
      "Please log in again.",
      true
    );

    return;

  }

  busy = true;

  $("sendBtn").disabled = true;
  $("prompt").disabled = true;

  $("prompt").value = "";
  $("prompt").style.height = "42px";

  addMessage("user", message);

  const previousHistory =
    chatHistory.slice(-16).map(function(item) {
      return {
        role: item.role,
        content: item.text
      };
    });

  chatHistory.push({
    role: "user",
    text: message
  });

  const typingRow = showTyping();

  try {

    const chatId = await ensureChat(message);

    await saveChatMessage(
      chatId,
      "user",
      message
    );

    const response = await fetch(
      APPS_SCRIPT_URL,
      {
        method: "POST",

        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },

        body: JSON.stringify({

          message: message,

          mode: $("modeSelect").value,

          engine: $("engineSelect").value,

          clientId: clientId,

          history: previousHistory,

          context: ""

        })

      }
    );

    if (!response.ok) {

      throw new Error(
        "Server request failed: HTTP " +
        response.status
      );

    }

    const result = await response.json();

    typingRow.remove();

    if (!result.success) {

      throw new Error(
        result.error || "STEVIE could not respond."
      );

    }

    const answer =
      String(result.reply || "");

    addMessage("assistant", answer);

    chatHistory.push({
      role: "assistant",
      text: answer
    });

    await saveChatMessage(
      chatId,
      "assistant",
      answer
    );

    if (
      result.sources &&
      result.sources.length
    ) {

      renderSources(result.sources);

    }

    if (result.searchWarning) {

      addMessage(
        "assistant",
        "Research notice: " + result.searchWarning
      );

    }

    await loadChatList();

  } catch (error) {

    typingRow.remove();

    addMessage(
      "assistant",
      "Error: " + error.message,
      true
    );

  } finally {

    busy = false;

    $("sendBtn").disabled = false;
    $("prompt").disabled = false;

    $("prompt").focus();

  }

}


/* SEND BUTTON AND ENTER KEY */

$("sendBtn").addEventListener(
  "click",
  sendMessage
);

$("prompt").addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


$("prompt").addEventListener(
  "input",
  function() {

    this.style.height = "42px";

    this.style.height =
      Math.min(this.scrollHeight, 180) + "px";

  }
);


/* START */

initialize();

</script>
