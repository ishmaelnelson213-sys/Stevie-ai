<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d18">
<title>STEVIE AI</title>

<style>
:root {
  --bg: #080d18;
  --panel: #101a2b;
  --panel2: #142238;
  --blue: #168cff;
  --text: #f3f7ff;
  --muted: #91a2bb;
  --border: #23334b;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  height: 100vh;
  overflow: hidden;
}

.app {
  display: flex;
  height: 100vh;
}

.sidebar {
  width: 260px;
  background: #0b1321;
  border-right: 1px solid var(--border);
  padding: 20px;
  display: flex;
  flex-direction: column;
}

.brand {
  font-size: 23px;
  font-weight: bold;
  letter-spacing: 1px;
  margin-bottom: 28px;
}

.brand span { color: var(--blue); }

.new-chat {
  background: var(--blue);
  border: 0;
  color: white;
  padding: 13px;
  border-radius: 10px;
  font-size: 15px;
  cursor: pointer;
}

.sidebar-title {
  color: var(--muted);
  font-size: 12px;
  margin: 28px 0 12px;
}

.history {
  overflow-y: auto;
  flex: 1;
}

.history-item {
  padding: 11px;
  border-radius: 8px;
  color: #c8d5e8;
  cursor: pointer;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 13px;
}

.history-item:hover {
  background: var(--panel2);
}

.sidebar-footer {
  color: var(--muted);
  font-size: 12px;
  border-top: 1px solid var(--border);
  padding-top: 15px;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.topbar {
  height: 65px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
}

.top-brand {
  font-weight: bold;
  font-size: 18px;
}

.status {
  color: #48d597;
  font-size: 12px;
}

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 25px 7%;
  scroll-behavior: smooth;
}

.welcome {
  text-align: center;
  margin: 12vh auto 0;
  max-width: 500px;
}

.welcome-mark {
  width: 65px;
  height: 65px;
  margin: auto auto 20px;
  display: grid;
  place-items: center;
  border-radius: 20px;
  background: var(--panel2);
  border: 1px solid #27517d;
  color: var(--blue);
  font-size: 35px;
  font-weight: bold;
}

.welcome h1 {
  font-size: 30px;
  margin-bottom: 10px;
}

.welcome h1 span { color: var(--blue); }

.welcome p {
  color: var(--muted);
  line-height: 1.6;
}

.message-row {
  display: flex;
  margin: 20px 0;
}

.message-row.user {
  justify-content: flex-end;
}

.user-bubble {
  max-width: 80%;
  background: #12365d;
  border: 1px solid #20558b;
  padding: 13px 16px;
  border-radius: 16px 16px 3px 16px;
  line-height: 1.6;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.assistant-content {
  max-width: 90%;
  line-height: 1.75;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.assistant-logo {
  width: 32px;
  height: 32px;
  object-fit: contain;
  margin-bottom: 8px;
  display: block;
}

.assistant-label {
  color: var(--blue);
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 6px;
}

.thinking {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 25px 0;
  color: var(--muted);
}

.thinking-symbol {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  background: var(--panel2);
  border: 1px solid #2864a0;
  border-radius: 11px;
  color: var(--blue);
  font-size: 23px;
  font-weight: bold;
  animation: glow 1.5s infinite;
}

.thinking-symbol span {
  animation: transformSymbol 2s infinite;
}

@keyframes transformSymbol {
  0%, 35% { opacity: 1; transform: scale(1); }
  45%, 60% { opacity: 0; transform: scale(.5); }
  70%, 100% { opacity: 1; transform: scale(1); }
}

@keyframes glow {
  50% { box-shadow: 0 0 18px #168cff77; }
}

.composer-area {
  padding: 15px 7% 22px;
  border-top: 1px solid var(--border);
}

.composer {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 10px;
}

textarea {
  flex: 1;
  resize: none;
  border: 0;
  outline: 0;
  background: transparent;
  color: white;
  font: inherit;
  padding: 9px;
  min-height: 40px;
  max-height: 130px;
}

textarea::placeholder { color: #71839d; }

.send {
  background: var(--blue);
  color: white;
  border: 0;
  border-radius: 11px;
  width: 42px;
  height: 42px;
  font-size: 20px;
  cursor: pointer;
}

.send:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.disclaimer {
  text-align: center;
  color: #71839d;
  font-size: 11px;
  margin-top: 10px;
}

.mobile-menu {
  display: none;
  background: transparent;
  border: 0;
  color: white;
  font-size: 22px;
}

@media(max-width:700px) {
  .sidebar {
    position: fixed;
    z-index: 5;
    top: 0;
    bottom: 0;
    left: -270px;
    transition: left .25s;
  }

  .sidebar.open { left: 0; }

  .mobile-menu { display: block; }

  .chat { padding: 20px 15px; }

  .composer-area { padding: 12px; }

  .welcome { margin-top: 15vh; }

  .welcome h1 { font-size: 25px; }

  .assistant-content { max-width: 96%; }
}
</style>
</head>

<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">STEVIE <span>AI</span></div>

    <button class="new-chat" onclick="newChat()">+ New Chat</button>

    <div class="sidebar-title">RECENT CHATS</div>
    <div class="history" id="history"></div>

    <div class="sidebar-footer">
      STEVIE AI<br>
      Your Intelligent AI Assistant
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="mobile-menu" onclick="toggleSidebar()">☰</button>
      <div class="top-brand">STEVIE <span style="color:#168cff">AI</span></div>
      <div class="status">● Ready</div>
    </header>

    <section class="chat" id="chat">
      <div class="welcome" id="welcome">
        <div class="welcome-mark">S</div>
        <h1>Meet <span>STEVIE AI</span></h1>
        <p>Your intelligent assistant for creativity, music, movies, coding and ideas.</p>
      </div>
    </section>

    <div class="composer-area">
      <div class="composer">
        <textarea id="messageInput"
          placeholder="Message STEVIE AI..."
          rows="1"></textarea>
        <button class="send" id="sendButton" onclick="sendMessage()">➤</button>
      </div>
      <div class="disclaimer">
        STEVIE AI can make mistakes. Check important information.
      </div>
    </div>
  </main>
</div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbxtKDjsn_KTi-Adx4e4Co0jyCmp5_gLQyc4VN7aJZ4IcJVlea_UzttFNzYVpozyQ5OD_g/exec";

const LOGO_FILE = "stevie-logo.png";

const input = document.getElementById("messageInput");
const chat = document.getElementById("chat");
const sendButton = document.getElementById("sendButton");

let messages = [];
let conversations = JSON.parse(
  localStorage.getItem("stevie_conversations") || "[]"
);

let clientId = localStorage.getItem("stevie_client_id");

if (!clientId) {
  clientId = "stevie-" + crypto.randomUUID();
  localStorage.setItem("stevie_client_id", clientId);
}

function saveHistory() {
  localStorage.setItem(
    "stevie_conversations",
    JSON.stringify(conversations)
  );
  renderHistory();
}

function renderHistory() {
  const history = document.getElementById("history");
  history.innerHTML = "";

  conversations.slice().reverse().forEach((item) => {
    const div = document.createElement("div");
    div.className = "history-item";
    div.textContent = item.title || "New Chat";
    div.onclick = () => loadConversation(item.id);
    history.appendChild(div);
  });
}

function newChat() {
  messages = [];
  chat.innerHTML = `
    <div class="welcome" id="welcome">
      <div class="welcome-mark">S</div>
      <h1>Meet <span>STEVIE AI</span></h1>
      <p>Your intelligent assistant for creativity, music, movies, coding and ideas.</p>
    </div>`;
  document.getElementById("sidebar").classList.remove("open");
}

function loadConversation(id) {
  const item = conversations.find(c => c.id === id);
  if (!item) return;

  messages = item.messages || [];
  chat.innerHTML = "";

  messages.forEach(m => {
    addMessage(m.role, m.text, false);
  });

  document.getElementById("sidebar").classList.remove("open");
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
}

function addMessage(role, text, scroll = true) {
  const welcome = document.getElementById("welcome");
  if (welcome) welcome.remove();

  const row = document.createElement("div");
  row.className = "message-row " + role;

  if (role === "user") {
    const bubble = document.createElement("div");
    bubble.className = "user-bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
  } else {
    const content = document.createElement("div");
    content.className = "assistant-content";

    const logo = document.createElement("img");
    logo.className = "assistant-logo";
    logo.src = LOGO_FILE;
    logo.alt = "STEVIE AI";
    logo.onerror = () => logo.remove();

    const label = document.createElement("div");
    label.className = "assistant-label";
    label.textContent = "STEVIE AI";

    const answer = document.createElement("div");
    answer.textContent = text;

    content.append(logo, label, answer);
    row.appendChild(content);
  }

  chat.appendChild(row);
  if (scroll) chat.scrollTop = chat.scrollHeight;
}

function showThinking() {
  const row = document.createElement("div");
  row.className = "thinking";
  row.id = "thinking";

  row.innerHTML = `
    <div class="thinking-symbol"><span>S</span></div>
    <span>STEVIE is thinking...</span>
  `;

  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function removeThinking() {
  const item = document.getElementById("thinking");
  if (item) item.remove();
}

function saveCurrentConversation() {
  if (!messages.length) return;

  const existing = conversations.find(c =>
    c.id === window.currentConversationId
  );

  if (existing) {
    existing.messages = messages;
  } else {
    window.currentConversationId = Date.now().toString();

    conversations.push({
      id: window.currentConversationId,
      title: messages[0].text.slice(0, 35),
      messages: messages
    });
  }

  saveHistory();
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text || sendButton.disabled) return;

  input.value = "";
  input.style.height = "40px";

  addMessage("user", text);
  messages.push({role:"user", text:text});

  sendButton.disabled = true;
  showThinking();

  try {
    const history = messages.slice(-16).map(m => ({
      role: m.role === "assistant" ? "assistant" : "user",
      text: m.text
    }));

    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        message: text,
        mode: "chat",
        clientId: clientId,
        history: history
      })
    });

    const data = await response.json();

    if (!response.ok || data.error) {
      throw new Error("Request failed");
    }

    const answer =
      data.reply ||
      data.response ||
      data.text ||
      data.message;

    if (!answer) {
      throw new Error("Empty response");
    }

    removeThinking();

    messages.push({role:"assistant", text:answer});
    addMessage("assistant", answer);

    saveCurrentConversation();

  } catch (error) {
    removeThinking();

    const friendly =
      "I'm having trouble connecting right now. Please try again in a moment.";

    addMessage("assistant", friendly);
  }

  sendButton.disabled = false;
  input.focus();
}

input.addEventListener("input", () => {
  input.style.height = "40px";
  input.style.height = Math.min(input.scrollHeight, 130) + "px";
});

input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

renderHistory();
</script>
</body>
</html>
